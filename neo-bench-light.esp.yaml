# Neo Bench Light
#
# Hardware notes from bench planning:
# - 24 V / 400 W supply is the main bus.
# - Lights get their own 24 V -> 12 V buck converter; do not fake 12 V with 24 V PWM.
# - Five independent CW/WW fixtures need ten PWM channels, so this stays on an original ESP32.
# - Each fixture measured 1.3 A max at 12 V on the bench supply.
# - Total light budget is 6.5 A / 78 W at 12 V.
# - USB-PD modules and stepper drivers stay on the 24 V bus.
# - Each strip channel is low-side switched with an IRLZ44N.
# - Gate wiring plan: ESP32 GPIO -> 100-220 ohm resistor -> MOSFET gate, with a 10k pulldown to ground.
# - Strip positive stays on the 12 V rail; MOSFETs switch the CW/WW returns.
#
# Pin notes:
# - These ten GPIOs are a first-pass mapping for the MOSFET gates.
# - Keep the PWM grounds and 12 V return wiring stout and out of the tiny logic ground paths.
# - Revisit the pin map once the controller board and wiring harness are finalized.

substitutions:
  friendly_name: Neo Bench Light
  name: neo_bench_light

packages:
  esp32-base: !include packages/esp32-base.esp.yaml
  # Five PWM fixtures share one template; each maps a pair of MOSFET gate GPIOs.
  fixture_1: !include { file: packages/neo-fixture.esp.yaml, vars: { n: 1, ww_pin: 23, cw_pin: 22 } }
  fixture_2: !include { file: packages/neo-fixture.esp.yaml, vars: { n: 2, ww_pin: 21, cw_pin: 19 } }
  fixture_3: !include { file: packages/neo-fixture.esp.yaml, vars: { n: 3, ww_pin: 18, cw_pin: 17 } }
  fixture_4: !include { file: packages/neo-fixture.esp.yaml, vars: { n: 4, ww_pin: 27, cw_pin: 14 } }

wifi:
  ap:
    ssid: "${friendly_name} Fallback"

esp32:
  board: esp32dev
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

web_server:
  port: 80
  local: true
  ota: false

# Onboard WS2812 status pixel, dim smooth hue cycle.
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: Status LED
    pin: GPIO16
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    # Linear so the hue stays accurate and 20% is a true 20% (no 8-bit low-end crush).
    gamma_correct: 1.0
    restore_mode: ALWAYS_ON
    effects:
      - addressable_lambda:
          name: Hue Cycle
          update_interval: 32ms
          lambda: |-
            // Dim, slow, continuous hue sweep on the single pixel.
            // `value` is the one brightness knob (0-255); green reads brightest, so keep it low.
            static float hue = 0.0f;
            hue += 0.5f;  // ~16 s per loop (256 / 0.5 * 32 ms)
            if (hue >= 256.0f) hue -= 256.0f;
            const uint8_t value = 24;
            it.all() = ESPHSVColor((uint8_t) hue, 255, value).to_rgb();

esphome:
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: status_led
          brightness: 50%
          effect: Hue Cycle
