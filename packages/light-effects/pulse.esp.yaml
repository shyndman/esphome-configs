lambda:
  name: Pulse
  update_interval: 100ms
  lambda: |-
    static bool high = false;
    constexpr uint32_t half_cycle_ms = 1000;
    constexpr uint32_t transition_length_ms = 1000;

    const bool target_high = (millis() % (half_cycle_ms * 2)) < half_cycle_ms;
    if (!initial_run && target_high == high) {
      return;
    }
    high = target_high;

    auto call = id(${light_id}).turn_on();
    call.set_brightness(high ? 1.0f : 0.0f);
    call.set_transition_length(transition_length_ms);
    call.set_publish(false);
    call.set_save(false);
    call.perform();
