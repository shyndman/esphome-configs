lambda:
  name: Flicker
  update_interval: 50ms
  lambda: |-
    static float max_brightness = 1.0f;
    static uint8_t burst_ticks = 0;
    constexpr uint32_t transition_length_ms = 0;

    if (initial_run) {
      max_brightness = id(${light_id}).remote_values.get_brightness();
      burst_ticks = 0;
    }

    float brightness_ratio = 1.0f;
    if (burst_ticks > 0) {
      burst_ticks--;
      const float r = random_float();
      if (r < 0.28f) {
        brightness_ratio = 0.0f;
      } else if (r < 0.62f) {
        brightness_ratio = 0.05f + (random_float() * 0.20f);
      } else if (r < 0.82f) {
        brightness_ratio = 0.35f + (random_float() * 0.35f);
      }
    } else {
      const float r = random_float();
      if (r < 0.018f) {
        burst_ticks = 2 + static_cast<uint8_t>(random_float() * 10.0f);
        brightness_ratio = 0.0f;
      } else if (r < 0.08f) {
        brightness_ratio = 0.65f + (random_float() * 0.30f);
      }
    }

    auto call = id(${light_id}).turn_on();
    call.set_brightness(max_brightness * brightness_ratio);
    call.set_transition_length(transition_length_ms);
    call.set_publish(false);
    call.set_save(false);
    call.perform();
