# Neo Bench Light fixture template.
#
# One CW/WW fixture = two LEDC channels + one cwww light.
# Included once per fixture from neo-bench-light.esp.yaml via packages,
# parameterized with:
#   n       - fixture index (1-based)
#   ww_pin  - warm-white MOSFET gate GPIO
#   cw_pin  - cold-white MOSFET gate GPIO

output:
  - platform: ledc
    id: fixture_${n}_ww_output
    pin: ${ww_pin}
    frequency: 1000Hz
  - platform: ledc
    id: fixture_${n}_cw_output
    pin: ${cw_pin}
    frequency: 1000Hz

light:
  - platform: cwww
    id: bench_light_${n}
    name: Bench Light ${n}
    cold_white: fixture_${n}_cw_output
    warm_white: fixture_${n}_ww_output
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K
    constant_brightness: false
    default_transition_length: 900ms
    gamma_correct: 2.2
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      !include
        file: light-effects/index.esp.yaml
        vars:
          light_id: bench_light_${n}
